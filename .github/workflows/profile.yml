name: Refresh profile stats

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render current public stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/render_profile.py --refresh
      - name: Commit updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.json assets/profile-dark.svg assets/profile-light.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public profile stats'
            git push
          fi
